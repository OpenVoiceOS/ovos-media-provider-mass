name: Coverage Report
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    with:
      # opm media_provider type is branch-only; ovoscope's MediaProviderHarness is
      # on dev but not yet on PyPI (alpha publish is currently broken), so both are
      # installed from git until they ship.
      pre_install_pip: "git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/media-provider-plugin-type git+https://github.com/OpenVoiceOS/ovoscope@dev"
      python_version: "3.12"
      test_extras: "test"
      test_path: "test/"
    secrets: inherit
